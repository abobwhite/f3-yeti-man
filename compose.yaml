services:
  mongo:
    image: mongo:8.0.30
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-dev-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok } catch (error) {
          rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); 0 }' | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mongo-dev-data:
